name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: make test

      - name: Build universal
        run: make build-universal VERSION="${{ steps.version.outputs.version }}"

      - name: Verify universal binaries
        run: |
          lipo -info claude-code-hooks
          lipo -info claude-code-hooks-notify.app/Contents/MacOS/claude-code-hooks-notify

      - name: Archive
        run: tar czf claude-code-hooks.tar.gz -C pkg claude-code-hooks

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes claude-code-hooks.tar.gz

      - name: Update Formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="https://github.com/${{ github.repository }}"
          TARBALL_URL="${REPO}/releases/download/v${VERSION}/claude-code-hooks.tar.gz"
          SHA256=$(shasum -a 256 claude-code-hooks.tar.gz | awk '{print $1}')

          cat > Formula/claude-code-hooks.rb << FORMULA_EOF
          class ClaudeCodeHooks < Formula
            desc "Claude Code hooks for Obsidian integration and notifications"
            homepage "${REPO}"
            url "${TARBALL_URL}"
            sha256 "${SHA256}"
            version "${VERSION}"

            depends_on :macos

            def install
              bin.install "claude-code-hooks"
              prefix.install "claude-code-hooks-notify.app"
              bin.write_exec_script prefix/"claude-code-hooks-notify.app/Contents/MacOS/claude-code-hooks-notify"
              (share/"claude-code-hooks").install "share/hooks.json"

              generate_completions_from_executable(bin/"claude-code-hooks", "completion", shells: [:bash, :zsh, :fish])
            end

            def post_install
              system "/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister",
                     "-R", prefix/"claude-code-hooks-notify.app"
            end

            def caveats
              <<~EOS
                インストール後、以下のコマンドで Claude Code に hooks を適用してください:

                  claude-code-hooks setup

                差分を事前に確認するには:

                  claude-code-hooks setup --diff

                シェル補完は自動的にインストールされています（Bash / Zsh / Fish）。

                通知をクリックすると、その Claude Code が動いている WezTerm のペインが前面化します。
                初回の通知時に通知の許可を求められるので許可してください
                （システム設定 > 通知 > claude-code-hooks-notify）。

                [推奨] Obsidian の Advanced URI プラグインを導入すると、
                ノートが新しいタブで開くようになります:
                  https://github.com/Vinzent03/obsidian-advanced-uri
              EOS
            end
          end
          FORMULA_EOF

          sed -i '' 's/^          //' Formula/claude-code-hooks.rb

      - name: Commit and push Formula update
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add Formula/claude-code-hooks.rb
          git diff --cached --quiet && exit 0
          git commit -m "ci: formula を v${VERSION} に更新"
          git push origin main
